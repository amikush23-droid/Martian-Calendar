<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Martian time: a 25-hour sol, archons and chrones, a 668 and 671 sol calendar, and the leap Chrone mechanism.">
<title>Martian Calendar</title>
<style>
:root{
  --bg:#2A1610; --card:#3b2219; --card2:#4a2b20; --ink:#f6ece2; --muted:#c9b3a3;
  --rust:#B5532E; --rust2:#d9734a; --ember:#FF7838; --sand:#E9D8C7; --gold:#e0b25a; --line:#5a3b2e; --cell:#2f1b13;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 600px at 50% -10%,#4a2619 0%,#2A1610 45%,#1a0c07 100%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block}
#mars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block}
a{color:var(--sand)}
nav.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 16px;
  background:rgba(42,22,16,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top a:first-of-type{margin-left:auto}
nav.top a{color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:999px;transition:background .2s,color .2s;cursor:pointer}
nav.top a:hover{color:var(--ink);background:var(--card)}
nav.top a.on{color:#fff;background:var(--rust)}
main{max-width:1160px;margin:0 auto;padding:22px 16px 70px}
.page{display:block;scroll-margin-top:140px;margin-bottom:56px}
.page.on{display:block;animation:pageIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0 0 10px;font-weight:bold}
h1{font-size:clamp(28px,4.6vw,50px);line-height:1.08}
h2{font-size:clamp(24px,3.2vw,34px)}
h3{font-size:20px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--rust2);margin:0 0 10px}
.lead{color:var(--muted);font-size:18px;max-width:720px;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015) 60%,rgba(255,255,255,.03)),linear-gradient(180deg,rgba(59,34,25,.22),rgba(44,26,19,.16));border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:18px;backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.25);animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card.golden-hue{
  background:linear-gradient(180deg, rgba(224,178,90,.26) 0%, rgba(158,108,36,.18) 52%, rgba(59,38,18,.48) 100%) !important;
  border-color:rgba(224,178,90,.82) !important;
  box-shadow:0 0 0 1px rgba(224,178,90,.35), 0 16px 42px rgba(224,178,90,.20), inset 0 1px 24px rgba(240,199,118,.14) !important;
}
.card.golden-hue h3{
  color:#ffe3a8;
  text-shadow:0 0 12px rgba(224,178,90,.35);
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.space{justify-content:space-between}
.mt{margin-top:18px}
button,.btn{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
  cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,background .2s,box-shadow .25s}
button:hover,.btn:hover{background:#5a3527;transform:translateY(-1px)}
button:active{transform:scale(.97)}
button.primary,.btn.primary{background:linear-gradient(180deg,var(--rust2),var(--rust));border-color:var(--rust);box-shadow:0 8px 20px rgba(181,83,46,.35)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default;transform:none}
input[type=range]{accent-color:var(--rust);width:100%;margin:8px 0 4px}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
label{display:block;font-size:14px;color:var(--muted)}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--rust);font-size:13px;margin:2px 4px 2px 0;transition:transform .3s}
.badge.gold{background:var(--gold);color:#2a1610}
.badge.ember{background:var(--ember);color:#1a0c07;font-weight:bold;box-shadow:0 0 14px rgba(255,120,56,.55)}
.badge.ghost{background:var(--card2)}
.banner{background:linear-gradient(90deg,rgba(224,178,90,.22),rgba(224,178,90,.06));border:1px solid rgba(224,178,90,.55);border-radius:14px;padding:12px 16px;margin-top:14px}
.detail{margin-top:12px;line-height:1.7}
.detail strong{color:var(--sand)}
.digital{font-size:18px;line-height:1.55;font-variant-numeric:tabular-nums;contain:layout}
.digital > div{white-space:nowrap}
#digBig,#solDigBig{font-size:clamp(17px,4.6vw,26px);transition:color .25s}
.digital .big{font-family:Cambria,Georgia,serif;font-size:28px;color:var(--sand)}
.digital .big.emberText{color:var(--ember);text-shadow:0 0 14px rgba(255,120,56,.35)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.dialWrap{position:relative;max-width:460px;margin:0 auto}
svg.dial{width:100%;height:auto;display:block;touch-action:none;cursor:grab;user-select:none}
svg.dial:active{cursor:grabbing}
.main-dial-group {
  transform: scale(1);
  transform-origin: 0px 0px;
  will-change: transform;
  transition: transform .72s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk {
  transform: scale(0.765);
  transition: transform .62s cubic-bezier(.16, 1, .3, 1);
}
.main-recess-veil {
  opacity: 0;
  transition: opacity .58s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk .main-recess-veil {
  opacity: 1;
  transition: opacity .48s ease-out;
}
.main-lock-halo {
  opacity: 0;
  transform: scale(0.975);
  transform-origin: 0px 0px;
  transition: opacity .62s cubic-bezier(.22, 1, .36, 1), transform .68s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk .main-lock-halo {
  opacity: 0.92;
  transform: scale(1);
  transition: opacity .42s ease-out, transform .56s cubic-bezier(.16, 1, .3, 1);
}
.dial-digi-text {
  transform: scale(1);
  transform-origin: 0px 26px;
  transition: fill .38s ease, transform .56s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk .dial-digi-text {
  transform: scale(1.12);
}
.leap-dial-group {
  opacity: 0;
  transform-origin: 0px 0px;
  pointer-events: none;
  transition: none;
}
.leap-track-layer {
  opacity: 0;
  transform: scale(0.79);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
  transition: none;
}
.leap-crown-layer {
  opacity: 0;
  transform: scale(0.84) rotate(-11deg);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
  transition: none;
}
.leap-sweep-layer {
  opacity: 0;
  transform: scale(0.88);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
  transition: none;
}
.leap-wave-ring {
  opacity: 0;
  transform: scale(0.77);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
}
.leap-dial-group.active {
  opacity: 1;
}
.leap-dial-group.active .leap-track-layer {
  opacity: 1;
  transform: scale(1);
  transition: transform .62s cubic-bezier(.16, 1, .3, 1), opacity .44s ease-out;
}
.leap-dial-group.active .leap-crown-layer {
  opacity: 1;
  transform: scale(1) rotate(0deg);
  transition: transform .68s cubic-bezier(.16, 1, .3, 1) .02s, opacity .48s ease-out .02s;
}
.leap-dial-group.active .leap-sweep-layer {
  opacity: 1;
  transform: scale(1);
  transition: transform .56s cubic-bezier(.16, 1, .3, 1) .04s, opacity .42s ease-out .03s;
}
.leap-dial-group.active .leap-wave-ring {
  animation: leapWaveActivate .68s cubic-bezier(.16, 1, .3, 1) forwards;
}
.leap-dial-group.inactivating {
  opacity: 1;
}
.leap-dial-group.inactivating .leap-track-layer {
  opacity: 0;
  transform: scale(1.045);
  transition: transform .62s cubic-bezier(.22, 1, .36, 1), opacity .54s cubic-bezier(.22, 1, .36, 1);
}
.leap-dial-group.inactivating .leap-crown-layer {
  opacity: 0;
  transform: scale(1.06) rotate(9deg);
  transition: transform .64s cubic-bezier(.22, 1, .36, 1), opacity .52s cubic-bezier(.22, 1, .36, 1);
}
.leap-dial-group.inactivating .leap-sweep-layer {
  opacity: 0;
  transform: scale(1.08);
  transition: transform .68s cubic-bezier(.16, 1, .3, 1), opacity .58s cubic-bezier(.22, 1, .36, 1);
}
.leap-dial-group.inactivating .leap-wave-ring {
  stroke: #e0b25a;
  animation: leapWaveInactivate .66s cubic-bezier(.16, 1, .3, 1) forwards;
}
@keyframes leapWaveActivate {
  0% { opacity: 0.85; transform: scale(0.77); stroke-width: 4.2px; }
  100% { opacity: 0; transform: scale(1.045); stroke-width: 0.8px; }
}
@keyframes leapWaveInactivate {
  0% { opacity: 0.9; transform: scale(1.01); stroke-width: 3.6px; }
  100% { opacity: 0; transform: scale(1.09); stroke-width: 0.6px; }
}
#leapBadge .badge, #solLeapBadge .badge {
  animation: badgeSmoothIn .38s cubic-bezier(.16, 1, .3, 1) both;
}
@keyframes badgeSmoothIn {
  from { opacity: 0; transform: translateY(4px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.ringLegend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ringPill{background:rgba(47,27,19,.75);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35;text-align:center}
.ringPill strong{display:block;font-size:13px;margin-bottom:2px}
.divBox{background:rgba(47,27,19,.65);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13.5px;line-height:1.6}
.divBox strong{color:var(--sand)}
.yearNum{font-family:Cambria,Georgia,serif;font-size:34px;color:var(--sand);margin-right:10px}
.yearBox{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.legend{font-size:13px;color:var(--muted);margin-top:10px}
.mcard{text-align:left;padding:12px;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.mcard strong{font-family:Cambria,Georgia,serif;font-size:16px}
.mcard.lm {
  background: linear-gradient(180deg, #f0c776, #c58d36) !important;
  color: #2a1610 !important;
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(224,178,90,.35), 0 10px 24px rgba(224,178,90,.12);
}
.mcard.lm .muted { color: rgba(42,22,16,.75) !important; }
.mcard:hover{transform:translateY(-3px)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px auto 0;max-width:640px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.sol{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:0;position:relative;background:var(--cell);
  border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink);transition:transform .15s,background .2s}
.sol.blank{background:transparent;border:none;cursor:default;transform:none!important}
.sol:hover{transform:scale(1.08);background:#43261b}
.sol.leap::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.sol.extra{border-color:var(--gold);animation:glow 2.4s ease-in-out infinite}
.sol.both{border-color:var(--ember);background:linear-gradient(145deg,rgba(255,120,56,.28),rgba(224,178,90,.22));box-shadow:0 0 12px rgba(255,120,56,.45)}
.sol.both::after{background:var(--ember);box-shadow:0 0 8px var(--ember),0 0 0 2px var(--gold)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,178,90,.0)}50%{box-shadow:0 0 14px 2px rgba(224,178,90,.45)}}
.sol.sel{background:var(--rust);border-color:var(--rust);transform:scale(1.06)}
.sol.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.cal-nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(233,216,199,.14)}
.cal-nav-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sol-clock-box{background:rgba(28,14,9,.45);border:1px solid rgba(224,178,90,.28);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.sol-info-panel{display:flex;flex-direction:column;justify-content:space-between;gap:14px;height:100%}
.sol-header-box{background:rgba(28,14,9,.38);border:1px solid rgba(233,216,199,.14);border-radius:14px;padding:14px 16px}
.sol-call-box{margin-top:10px;padding:9px 12px;border-radius:10px;background:rgba(47,27,19,.65);border-left:3px solid var(--rust2);font-size:13.5px;line-height:1.45;color:var(--ink)}
.sol-call-box.gold{border-left-color:var(--gold);background:rgba(224,178,90,.11)}
.sol-call-box.ember{border-left-color:var(--ember);background:rgba(255,120,56,.14)}
.sol-metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sol-metric-card{background:rgba(28,14,9,.42);border:1px solid rgba(233,216,199,.12);border-radius:12px;padding:11px 13px}
.sol-metric-card .m-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:3px}
.sol-metric-card .m-val{font-family:Cambria,Georgia,serif;font-size:21px;font-weight:bold;color:var(--sand);line-height:1.15}
.sol-metric-card .m-sub{font-size:12px;color:var(--muted);margin-top:3px}
.sol-telem-box{background:rgba(28,14,9,.42);border:1px solid rgba(233,216,199,.12);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.telem-row-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
.telem-bar{height:7px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.telem-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rust),var(--gold));transition:width .4s ease}
.telem-sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.sol-week-box{background:rgba(28,14,9,.42);border:1px solid rgba(233,216,199,.12);border-radius:12px;padding:11px 13px}
.sol-week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.sol-sun-box{background:rgba(28,14,9,.42);border:1px solid rgba(233,216,199,.12);border-radius:12px;padding:11px 13px}
.sun-svg{width:100%;height:auto;display:block;margin-top:6px;border-radius:9px;background:linear-gradient(180deg,rgba(217,115,74,.14) 0%,rgba(224,178,90,.07) 46%,rgba(14,6,4,.65) 46%,rgba(10,4,3,.82) 100%);border:1px solid rgba(233,216,199,.1);cursor:ew-resize;touch-action:none;user-select:none}
.wk-btn{padding:6px 2px;border-radius:9px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.wk-btn strong{font-size:13px;color:var(--ink)}
.wk-btn:hover:not(:disabled){transform:translateY(-2px);background:#43261b}
.wk-btn.active{background:var(--rust);border-color:var(--sand);color:#fff;box-shadow:0 4px 12px rgba(181,83,46,.4)}
.wk-btn.active strong{color:#fff}
.wk-btn.is-chrone{border-color:rgba(224,178,90,.6)}
.ring{position:relative;width:min(380px,92vw);aspect-ratio:1;margin:12px auto}
.mnode{position:absolute;width:36px;height:36px;border-radius:50%;padding:0;font-size:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card2);transition:transform .2s,background .2s;animation:rise .6s both}
.mnode:hover{transform:scale(1.18);background:var(--rust)}
.ringCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:150px;font-size:14px;line-height:1.4}
.ringCenter .big{font-family:Cambria,Georgia,serif;font-size:22px;color:var(--sand)}
.stat{text-align:left}
.stat .num{font-family:Cambria,Georgia,serif;font-size:36px;color:var(--sand)}
.navcard{display:block;text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .25s}
.navcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.navcard h3{color:var(--sand)}
#home{min-height:calc(100vh - 100px)}
@media (min-width:1150px){.home-head h1{margin-left:-26px}}
.homeBox{padding:24px 24px 44px;max-width:520px;position:relative;left:-14px;top:24px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.18);border-radius:22px;backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.25)}
.homeTitle{font-size:clamp(22px,2.8vw,30px);line-height:1.1;color:var(--sand);margin:0 0 18px}
.homeType{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:clamp(15px,1.4vw,17px);line-height:1.6;color:var(--ink);margin:0;white-space:pre-line;text-align:justify}
.clockBox{padding:26px 28px;border-radius:20px;margin-bottom:24px}
.clockTitle{font-family:Cambria,Georgia,serif;font-size:clamp(22px,2.8vw,30px);color:var(--sand);line-height:1.2;margin:0 0 22px}
.clockCardText{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:clamp(15px,1.4vw,17px);line-height:1.75;text-align:justify;color:var(--ink)}
.clockCardText p{margin:0 0 20px}

.hl{color:#e0b25a;font-weight:bold}
.eq{white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;margin-top:12px;padding-top:12px}
.bar{flex:1;background:linear-gradient(180deg,var(--rust2),var(--rust));border-radius:10px 10px 4px 4px;position:relative;
  transition:height .9s cubic-bezier(.2,.7,.2,1);min-height:4px}
.bar span{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.bar b{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:13px;color:var(--sand)}
/* Upgraded Weekday Drift Section */
.drift-console-grid {
  display: grid;
  grid-template-columns: minmax(340px, 390px) 1fr;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 860px) {
  .drift-console-grid {
    grid-template-columns: 1fr;
  }
}
.drift-wheel-box {
  background: rgba(28, 14, 9, 0.45);
  border: 1px solid rgba(224, 178, 90, 0.28);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
.drift-wheel-svg {
  width: 100%;
  max-width: 350px;
  height: auto;
  display: block;
  user-select: none;
}
.drift-node {
  cursor: pointer;
  pointer-events: all;
}
.drift-node-body {
  transform-origin: center;
  transform-box: fill-box;
  transition: transform .22s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
.drift-node:hover .drift-node-body,
.drift-node.is-hover .drift-node-body {
  transform: scale(1.22);
}
.drift-node-bg {
  transition: fill .2s ease, stroke .2s ease, stroke-width .2s ease, filter .2s ease;
}
.drift-node:hover .drift-node-bg,
.drift-node.is-hover .drift-node-bg {
  stroke: #ffe3a8 !important;
  stroke-width: 2.4px !important;
  fill: #542b1a !important;
  filter: drop-shadow(0 0 8px rgba(224, 178, 90, 0.65));
}
.drift-node.is-active:hover .drift-node-bg,
.drift-node.is-active.is-hover .drift-node-bg {
  stroke: #ffffff !important;
  stroke-width: 2.8px !important;
  fill: #FF7838 !important;
  filter: drop-shadow(0 0 10px rgba(255, 120, 56, 0.85));
}
.drift-node-text {
  transition: fill .2s ease, font-size .2s ease;
  user-select: none;
}
.drift-node:hover .drift-node-text,
.drift-node.is-hover .drift-node-text {
  fill: #ffffff !important;
  font-size: 13px !important;
}
.drift-node-glow {
  transition: opacity .25s ease, stroke .25s ease;
}
.drift-node:hover .drift-node-glow,
.drift-node.is-hover .drift-node-glow {
  opacity: 0.85 !important;
}
