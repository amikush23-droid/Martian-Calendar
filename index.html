<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Martian time: a 25-hour sol, archons and chrones, a 668 and 671 sol calendar, and the leap Chrone mechanism.">
<title>Martian Calendar</title>
<style>
:root{
  --bg:#2A1610; --card:#3b2219; --card2:#4a2b20; --ink:#f6ece2; --muted:#c9b3a3;
  --rust:#B5532E; --rust2:#d9734a; --ember:#FF7838; --sand:#E9D8C7; --gold:#e0b25a; --line:#5a3b2e; --cell:#2f1b13;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 600px at 50% -10%,#4a2619 0%,#2A1610 45%,#1a0c07 100%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block}
#mars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:block}
a{color:var(--sand)}
nav.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 16px;
  background:rgba(42,22,16,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top a:first-of-type{margin-left:auto}
nav.top a{color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:999px;transition:background .2s,color .2s;cursor:pointer}
nav.top a:hover{color:var(--ink);background:var(--card)}
nav.top a.on{color:#fff;background:var(--rust)}
main{max-width:1160px;margin:0 auto;padding:22px 16px 70px}
.page{display:block;scroll-margin-top:140px;margin-bottom:56px}
.page.on{display:block;animation:pageIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0 0 10px;font-weight:bold}
h1{font-size:clamp(28px,4.6vw,50px);line-height:1.08}
h2{font-size:clamp(24px,3.2vw,34px)}
h3{font-size:20px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--rust2);margin:0 0 10px}
.lead{color:var(--muted);font-size:18px;max-width:720px;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015) 60%,rgba(255,255,255,.03)),linear-gradient(180deg,rgba(59,34,25,.22),rgba(44,26,19,.16));border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:18px;backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.25);animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card.golden-hue{
  background:linear-gradient(180deg, rgba(224,178,90,.26) 0%, rgba(158,108,36,.18) 52%, rgba(59,38,18,.48) 100%) !important;
  border-color:rgba(224,178,90,.82) !important;
  box-shadow:0 0 0 1px rgba(224,178,90,.35), 0 16px 42px rgba(224,178,90,.20), inset 0 1px 24px rgba(240,199,118,.14) !important;
}
.card.golden-hue h3{
  color:#ffe3a8;
  text-shadow:0 0 12px rgba(224,178,90,.35);
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.space{justify-content:space-between}
.mt{margin-top:18px}
button,.btn{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
  cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,background .2s,box-shadow .25s}
button:hover,.btn:hover{background:#5a3527;transform:translateY(-1px)}
button:active{transform:scale(.97)}
input[type=range]{accent-color:var(--rust);width:100%;margin:8px 0 4px}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
label{display:block;font-size:14px;color:var(--muted)}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--rust);font-size:13px;margin:2px 4px 2px 0;transition:transform .3s}
.badge.gold{background:var(--gold);color:#2a1610}
.badge.ember{background:var(--ember);color:#1a0c07;font-weight:bold;box-shadow:0 0 14px rgba(255,120,56,.55)}
.badge.ghost{background:var(--card2)}
.banner{background:linear-gradient(90deg,rgba(224,178,90,.22),rgba(224,178,90,.06));border:1px solid rgba(224,178,90,.55);border-radius:14px;padding:12px 16px;margin-top:14px}
.detail{margin-top:12px;line-height:1.7}
.detail strong{color:var(--sand)}
.digital{font-size:18px;line-height:1.55;font-variant-numeric:tabular-nums;contain:layout}
.digital > div{white-space:nowrap}
#digBig,#solDigBig{font-size:clamp(17px,4.6vw,26px);transition:color .25s}
.digital .big{font-family:Cambria,Georgia,serif;font-size:28px;color:var(--sand)}
.digital .big.emberText{color:var(--ember);text-shadow:0 0 14px rgba(255,120,56,.35)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.dialWrap{position:relative;max-width:460px;margin:0 auto}
svg.dial{width:100%;height:auto;display:block;touch-action:none;cursor:grab;user-select:none}
svg.dial:active{cursor:grabbing}
.main-dial-group {
  transform: scale(1);
  transform-origin: 0px 0px;
  will-change: transform;
  transition: transform .72s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk {
  transform: scale(0.765);
  transition: transform .62s cubic-bezier(.16, 1, .3, 1);
}
.main-recess-veil {
  opacity: 0;
  transition: opacity .58s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk .main-recess-veil {
  opacity: 1;
  transition: opacity .48s ease-out;
}
.main-lock-halo {
  opacity: 0;
  transform: scale(0.975);
  transform-origin: 0px 0px;
  transition: opacity .62s cubic-bezier(.22, 1, .36, 1), transform .68s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk .main-lock-halo {
  opacity: 0.92;
  transform: scale(1);
  transition: opacity .42s ease-out, transform .56s cubic-bezier(.16, 1, .3, 1);
}
.dial-digi-text {
  transform: scale(1);
  transform-origin: 0px 26px;
  transition: fill .38s ease, transform .56s cubic-bezier(.16, 1, .3, 1);
}
.main-dial-group.shrunk .dial-digi-text {
  transform: scale(1.12);
}
}
.leap-track-layer {
  opacity: 0;
  transform: scale(0.79);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
  transition: none;
}
.leap-crown-layer {
  opacity: 0;
  transform: scale(0.84) rotate(-11deg);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
  transition: none;
}
.leap-sweep-layer {
  opacity: 0;
  transform: scale(0.88);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
  transition: none;
}
.leap-wave-ring {
  opacity: 0;
  transform: scale(0.77);
  transform-origin: 0px 0px;
  will-change: transform, opacity;
}
.leap-dial-group.active {
  opacity: 1;
}
.leap-dial-group.active .leap-track-layer {
  opacity: 1;
  transform: scale(1);
  transition: transform .62s cubic-bezier(.16, 1, .3, 1), opacity .44s ease-out;
.sol-sun-box{background:rgba(28,14,9,.42);border:1px solid rgba(233,216,199,.12);border-radius:12px;padding:11px 13px}
.sun-svg{width:100%;height:auto;display:block;margin-top:6px;border-radius:9px;background:linear-gradient(180deg,rgba(217,115,74,.14) 0%,rgba(224,178,90,.07) 46%,rgba(14,6,4,.65) 46%,rgba(10,4,3,.82) 100%);border:1px solid rgba(233,216,199,.1);cursor:ew-resize;touch-action:none;user-select:none}
.wk-btn{padding:6px 2px;border-radius:9px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.wk-btn strong{font-size:13px;color:var(--ink)}
.wk-btn:hover:not(:disabled){transform:translateY(-2px);background:#43261b}
.wk-btn.active{background:var(--rust);border-color:var(--sand);color:#fff;box-shadow:0 4px 12px rgba(181,83,46,.4)}
.wk-btn.active strong{color:#fff}
.wk-btn.is-chrone{border-color:rgba(224,178,90,.6)}
.ring{position:relative;width:min(380px,92vw);aspect-ratio:1;margin:12px auto}
.mnode{position:absolute;width:36px;height:36px;border-radius:50%;padding:0;font-size:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card2);transition:transform .2s,background .2s;animation:rise .6s both}
.mnode:hover{transform:scale(1.18);background:var(--rust)}
.ringCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:150px;font-size:14px;line-height:1.4}
.ringCenter .big{font-family:Cambria,Georgia,serif;font-size:22px;color:var(--sand)}
.stat{text-align:left}
.stat .num{font-family:Cambria,Georgia,serif;font-size:36px;color:var(--sand)}
.navcard{display:block;text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .25s}
.navcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.navcard h3{color:var(--sand)}
#home{min-height:calc(100vh - 100px)}
@media (min-width:1150px){.home-head h1{margin-left:-26px}}
.homeBox{padding:24px 24px 44px;max-width:520px;position:relative;left:-14px;top:24px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.18);border-radius:22px;backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.25)}
.homeTitle{font-size:clamp(22px,2.8vw,30px);line-height:1.1;color:var(--sand);margin:0 0 18px}
.homeType{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:clamp(15px,1.4vw,17px);line-height:1.6;color:var(--ink);margin:0;white-space:pre-line;text-align:justify}
.clockBox{padding:26px 28px;border-radius:20px;margin-bottom:24px}
.clockTitle{font-family:Cambria,Georgia,serif;font-size:clamp(22px,2.8vw,30px);color:var(--sand);line-height:1.2;margin:0 0 22px}
.clockCardText{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:clamp(15px,1.4vw,17px);line-height:1.75;text-align:justify;color:var(--ink)}
.clockCardText p{margin:0 0 20px}
.clockCardText p:last-child{margin-bottom:0}

.hl{color:#e0b25a;font-weight:bold}
.eq{white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;margin-top:12px;padding-top:12px}
.bar{flex:1;background:linear-gradient(180deg,var(--rust2),var(--rust));border-radius:10px 10px 4px 4px;position:relative;
  transition:height .9s cubic-bezier(.2,.7,.2,1);min-height:4px}
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.22s;
  white-space: nowrap;
}
.fs-lock-toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

/* Fullscreen Enforcement Curtain when Quiz is Active */
.quiz-fs-guard {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(circle at 50% 45%, rgba(42, 22, 16, 0.94), rgba(14, 6, 4, 0.98));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
}
.quiz-fs-guard.active {
  display: flex;
  opacity: 1;
  pointer-events: all;
}
